<style>
/* Layout: one centred arcade screen, touch pad under it, small legend + credit at the foot. Single dark look by design. */
:root{
  --void:#05070c;      /* page ground */
  --panel:#0e1320;     /* overlay panels */
  --ink:#e4f1e6;       /* text */
  --leaf:#86dc6c;      /* Muda's green */
  --holo:#5ff2d0;      /* holographic UI, the accent */
  --uv:#b98cff;        /* UV lamps */
  --dim:#6f7d96;       /* captions */
  --pixel:"Press Start 2P", ui-monospace, monospace;
  --term:"VT323", ui-monospace, monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink)}
body{
  font-family:var(--term);font-size:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px;box-sizing:border-box;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#wrap{position:relative;width:640px;max-width:100%;aspect-ratio:640/352;flex:none;
  box-shadow:0 0 0 2px #151c2c,0 0 0 4px #070a11,0 18px 60px -20px rgba(95,242,208,.25)}
#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(4,6,11,.86);padding:6%;box-sizing:border-box;cursor:pointer}
#ovBox{max-width:34em;display:flex;flex-direction:column;gap:.9em}
#ovKicker{margin:0;font-family:var(--pixel);font-size:clamp(7px,1.25vw,11px);color:var(--holo);letter-spacing:.06em;line-height:1.6}
#ovText{margin:0;font-family:var(--term);font-size:clamp(17px,3.1vw,30px);line-height:1.25;color:var(--ink);min-height:3.8em;text-wrap:pretty}
#overlay.log #ovText{color:#bfe8b0}
#overlay.card #ovText{font-family:var(--pixel);font-size:clamp(11px,2.4vw,22px);line-height:1.5;color:var(--leaf);min-height:0}
#ovBtn{align-self:flex-start;font-family:var(--pixel);font-size:clamp(7px,1.2vw,10px);color:#04201a;background:var(--holo);
  border:0;padding:.8em 1.1em;cursor:pointer;box-shadow:0 3px 0 #1d7d68}
#ovBtn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#pad{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;max-width:640px;flex:none;touch-action:none}
.cluster{display:flex;gap:6px;align-items:center;flex:1 1 0;min-width:0}
.cluster:last-child{justify-content:flex-end}
.pb{font-family:var(--pixel);font-size:clamp(7px,2.2vw,10px);color:var(--ink);background:#162036;border:0;border-radius:6px;
  flex:0 1 64px;min-width:0;height:56px;padding:0 4px;overflow:hidden;box-shadow:0 4px 0 #0a0f1c;touch-action:none}
.pb.arrow{font-family:system-ui,sans-serif;font-size:22px}
.pb.jump{background:#1d7d68;color:#eafffb;box-shadow:0 4px 0 #0e4237}
.pb.on{transform:translateY(3px);box-shadow:0 1px 0 #0a0f1c;filter:brightness(1.3)}
#legend,#credit{margin:0;text-align:center;max-width:58em;line-height:1.2}
#legend{color:var(--ink);font-size:18px}
#legend b{font-family:var(--pixel);font-size:9px;color:var(--holo);font-weight:400;padding:0 2px}
#credit{color:var(--dim);font-size:16px}
@media (pointer:coarse){#legend{display:none}}
@media (prefers-reduced-motion:reduce){.pb.on{transform:none}}

<body>
<div id="wrap">
  <canvas id="game" width="640" height="352" aria-label="Muda: Fuga do Setor 9, jogo de plataforma e furtividade"></canvas>
  <div id="overlay" hidden>
    <div id="ovBox">
      <p id="ovKicker"></p>

</div>
<div id="pad" hidden>

    <button class="pb arrow" data-k="left" aria-label="Esquerda">◀</button>

    <button class="pb arrow" data-k="right" aria-label="Direita">▶</button>

<p id="credit">Demo de fã com história e personagens originais, inspirada em <i>Paradise Lost: First Contact</i> (Asthree Works, 2013).</p>

<script>
'use strict';
(function(){
/* Logic runs in an 8px tile world of 320x176; everything is drawn at 2x (640x352) so the art can carry half-pixel detail. */
const W=320,H=176,T=8,Z=2,SW=W*Z,SH=H*Z,U=T*Z;
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const FONT='"Press Start 2P", monospace',TERM='VT323, monospace';
const overlay=document.getElementById('overlay'),ovKicker=document.getElementById('ovKicker'),ovText=document.getElementById('ovText'),ovBtn=document.getElementById('ovBtn');
const pad=document.getElementById('pad'),wrap=document.getElementById('wrap');

/* ================= INPUT ================= */
const held={},prev={},latch={};
let tapped=false,touchMode=false;
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',KeyZ:'jump',Space:'jump',
  ArrowDown:'down',KeyS:'down',KeyX:'vine',KeyK:'vine',KeyC:'spore',KeyL:'spore',Enter:'ok',KeyP:'pause',Escape:'pause',KeyM:'mute'};
addEventListener('keydown',e=>{const a=KEYMAP[e.code];if(!a)return;e.preventDefault();if(!e.repeat)latch[a]=true;held[a]=true;initAudio();});
addEventListener('keyup',e=>{const a=KEYMAP[e.code];if(!a)return;e.preventDefault();held[a]=false;});
const pressed=a=>!!latch[a]||(!!held[a]&&!prev[a]);
function enableTouch(){if(touchMode)return;touchMode=true;pad.hidden=false;fit();}
if(matchMedia('(pointer:coarse)').matches){touchMode=true;pad.hidden=false;}
addEventListener('touchstart',enableTouch,{passive:true});
pad.querySelectorAll('.pb').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();held[k]=true;latch[k]=true;b.classList.add('on');initAudio();try{b.setPointerCapture(e.pointerId)}catch(_){}};
  const off=e=>{e.preventDefault();held[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);
  b.addEventListener('lostpointercapture',off);b.addEventListener('contextmenu',e=>e.preventDefault());
});
overlay.addEventListener('pointerdown',e=>{e.preventDefault();tapped=true;initAudio();});
cv.addEventListener('pointerdown',()=>{tapped=true;initAudio();});
addEventListener('blur',()=>{for(const k in held)held[k]=false;if(mode==='play')mode='paused';});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')mode='paused';});
const confirmPressed=()=>pressed('ok')||pressed('jump')||tapped;

/* ================= AUDIO ================= */
let actx=null,muted=false,drone=null;
function initAudio(){
  if(actx)return;
  try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(_){actx=null;return;}
  try{const o=actx.createOscillator(),o2=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.value=55;o2.type='triangle';o2.frequency.value=82.6;g.gain.value=0;
    o.connect(g);o2.connect(g);g.connect(actx.destination);o.start();o2.start();drone=g;}catch(_){}
}
function tone(type,f0,f1,dur,vol,delay){
  if(!actx||muted)return;
  const t=actx.currentTime+(delay||0),o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+0.02);
}
function sfx(n){
  switch(n){
    case 'jump':tone('square',260,520,0.09,0.05);break;
    case 'land':tone('triangle',120,70,0.05,0.04);break;
    case 'vine':tone('sawtooth',180,900,0.16,0.04);break;
    case 'spore':tone('triangle',420,140,0.18,0.06);break;
    case 'puff':tone('sine',160,60,0.3,0.07);break;
    case 'pick':tone('sine',660,1320,0.12,0.06);tone('sine',990,1980,0.1,0.04,0.06);break;
    case 'door':tone('square',140,280,0.12,0.05);tone('square',280,560,0.12,0.04,0.12);break;
    case 'check':tone('sine',520,520,0.08,0.05);tone('sine',780,780,0.12,0.05,0.09);break;
    case 'sus':tone('square',880,880,0.04,0.03);break;
    case 'caught':tone('sawtooth',520,70,0.6,0.07);tone('square',1040,140,0.5,0.03);break;
    case 'win':[523,659,784,1046].forEach((f,i)=>tone('triangle',f,f,0.18,0.06,i*0.12));break;
    case 'nope':tone('square',150,110,0.12,0.04);break;
    case 'zz':tone('sine',300,200,0.25,0.03);break;
  }
}
function setDrone(on){if(!drone||!actx)return;drone.gain.setTargetAtTime(on&&!muted?0.018:0,actx.currentTime,0.4);}

/* ================= PIXEL HELPERS ================= */
function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function flip(c){const f=cnv(c.width,c.height),x=f.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return f;}
function outline(c,col){
  const x=c.getContext('2d'),w=c.width,h=c.height,d=x.getImageData(0,0,w,h),a=d.data,o=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++)o[i]=a[i*4+3]>0?1:0;
  x.fillStyle=col;
  for(let y=0;y<h;y++)for(let i=0;i<w;i++){if(o[y*w+i])continue;
    if((i>0&&o[y*w+i-1])||(i<w-1&&o[y*w+i+1])||(y>0&&o[(y-1)*w+i])||(y<h-1&&o[(y+1)*w+i]))x.fillRect(i,y,1,1);}
  return c;
}
function hexToRgb(h){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
function mix(a,b,k){const A=hexToRgb(a),B=hexToRgb(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')';}
function hash(x,y){let h=(x*374761393+y*668265263)^0x5bd1e995;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967295;}

/* ================= CHARACTER ART ================= */
// Muda: a seed-bulb with glowing veins, leaf crown and a violet bud. Drawn per pose, then outlined.
function makeMuda(o){
  const w=26,h=28,c=cnv(w,h),x=c.getContext('2d');
  const P=(px,py,col)=>{x.fillStyle=col;x.fillRect(px,py,1,1);};
  let cx=13,cy,rx,ry;
  if(o.mode==='crouch'){rx=8.6;ry=4.6;cy=h-5.5;}
  else if(o.mode==='air'){rx=6.4;ry=7.2;cy=h-11;}
  else{rx=7.2;ry=6.4;cy=h-9.5+(o.bob||0);}
  const bottom=Math.floor(cy+ry);
  // roots / feet
  if(o.mode==='crouch'){
    [[-7,0],[-4,1],[4,1],[7,0]].forEach(([dx,dy],i)=>{P(cx+dx,h-1-dy,'#10333a');P(cx+dx+(dx<0?-1:1),h-1,i%2?'#5ff2d0':'#10333a');});
  }else if(o.mode==='hang'||o.mode==='air'){
    for(let i=0;i<3;i++){P(cx-3-(i>>1),bottom+i,'#123f3c');P(cx+3+(i>>1),bottom+i,'#123f3c');}
    P(cx-4,bottom+3,'#5ff2d0');P(cx+4,bottom+3,'#5ff2d0');
  }else{
    const legs=[[-3,o.leg||0],[3,-(o.leg||0)]];
    for(const [lx,ph] of legs){
      const n=h-1-bottom;
      for(let i=0;i<=n;i++){const xx=cx+lx+Math.round(ph*i/Math.max(1,n));P(xx,bottom+i,'#123f3c');if(i===n){P(xx+(lx<0?-1:1),bottom+i,'#123f3c');P(xx,bottom+i,'#2fa37a');}}
    }
  }
  // body with upper-left light
  for(let py=0;py<h;py++)for(let px=0;px<w;px++){
    const nx=(px+0.5-cx)/rx,ny=(py+0.5-cy)/ry;if(nx*nx+ny*ny>1)continue;
    const l=-nx*0.45-ny*0.75+((px+py)%2?0.06:-0.06);
    P(px,py,l>0.55?'#56d39c':l>0.15?'#2fa37a':l>-0.3?'#1f735f':'#134743');
  }
  // belly glow + veins
  const f=o.face||1;
  const veins=[[0,4],[0,5],[-1,5],[1,6],[-4,3],[-5,2],[4,3],[5,2],[-3,5],[3,5]];
  for(const [vx,vy] of veins){const px=Math.round(cx+vx),py=Math.round(cy+vy-(o.mode==='crouch'?2:0));const nx=(px+0.5-cx)/rx,ny=(py+0.5-cy)/ry;if(nx*nx+ny*ny<0.9)P(px,py,(vx===0&&vy===4)?'#c8fff1':'#46d8b8');}
  // eyes
  const ey=Math.round(cy-(o.mode==='crouch'?2:2));
  for(const ex of [Math.round(cx-3+f),Math.round(cx+2+f)]){
    if(o.blink){x.fillStyle='#04100f';x.fillRect(ex-1,ey+1,3,1);continue;}
    x.fillStyle='#eafffb';x.fillRect(ex-1,ey-1,3,4);x.fillStyle='#04100f';x.fillRect(f>0?ex+1:ex-1,ey,1,2);x.fillStyle='#ffffff';x.fillRect(f>0?ex-1:ex+1,ey-1,1,1);
  }
  // crown
  const top=Math.round(cy-ry),s=o.sway||0;
  if(o.mode==='hang'){
    x.fillStyle='#2fa37a';for(let i=0;i<top;i++){x.fillRect(cx-1,i,1,1);}x.fillStyle='#1f735f';x.fillRect(cx,0,1,top);
    P(cx-4,top+1,'#3fae4f');P(cx-5,top,'#8ee36a');P(cx+3,top+1,'#3fae4f');P(cx+4,top,'#8ee36a');
  }else{
    x.fillStyle='#2f8a3c';x.fillRect(cx,top-4,1,4);
    const leafL=[[-1,-1],[-2,-2],[-3,-2],[-4,-3],[-5,-3],[-3,-1],[-4,-2],[-2,-1]],leafR=leafL.map(([a,b])=>[-a,b]);
    leafL.forEach(([a,b],i)=>P(cx+a+(b<-2?s:0),top+b,i<5?'#3fae4f':'#8ee36a'));
    leafR.forEach(([a,b],i)=>P(cx+a+(b<-2?s:0),top+b,i<5?'#3fae4f':'#8ee36a'));
    x.fillStyle='#b54fd6';x.fillRect(cx-1+(s>0?1:0),top-6,3,2);x.fillStyle='#ff9cf3';x.fillRect(cx+(s>0?1:0),top-6,1,1);
  }
  return outline(c,'#03100f');
}
const MUDA={};
(function(){
  const defs={idle0:{mode:'stand'},idle1:{mode:'stand',sway:1,bob:0},blink:{mode:'stand',blink:1},
    walk0:{mode:'stand',leg:-2,bob:0},walk1:{mode:'stand',leg:0,bob:-1,sway:1},walk2:{mode:'stand',leg:2,bob:0},walk3:{mode:'stand',leg:0,bob:-1,sway:-1},
    air:{mode:'air',sway:-1},crouch:{mode:'crouch'},hang:{mode:'hang'}};
  for(const k in defs){const r=makeMuda(Object.assign({face:1},defs[k]));MUDA[k]={r,l:flip(r),w:r.width,h:r.height};}
})();

// Guards: tactical armour with a rifle-mounted torch. Technicians: lab coat and a glowing tablet.
function makeGuard(frame,sleep,type){
  const w=22,h=33,c=cnv(w,h),x=c.getContext('2d');
  const r=(a,b,cw,ch,col)=>{x.fillStyle=col;x.fillRect(a,b,cw,ch);};
  const ph=sleep?0:[0,1,0,-1][frame%4];
  const lift=sleep?0:(frame%2?-1:0);
  const sci=type==='sci';
  const pants=sci?'#2c3240':'#1b202b',pantsD=sci?'#20242f':'#11151d',boot=sci?'#16181d':'#0a0b0f';
  // legs
  r(7-ph*2,22,3,8,pantsD);r(5-ph*2,30,5,2,boot);
  r(10+ph*2,22,3,8,pants);r(10+ph*2,30,5,2,boot);
  if(!sci){r(10+ph*2,25,3,2,'#323a4b');}
  if(sci){
    r(6,11+lift,9,15,'#d6dee6');r(6,11+lift,2,15,'#aab6c2');r(13,11+lift,2,15,'#b9c4cf');r(10,11+lift,1,8,'#8d9aaa');
    r(9,11+lift,3,3,'#3a6a9a');
    r(14,15+lift,5,6,'#1b2230');r(15,16+lift,3,4,sleep?'#20303e':'#7fe0ff');r(13,16+lift,2,3,'#c9926f');
    const hy=sleep?2:0,hx=sleep?1:0;
    r(7+hx,2+hy+lift,7,3,'#2e2420');r(7+hx,4+hy+lift,2,4,'#2e2420');r(9+hx,4+hy+lift,5,6,'#c9926f');r(9+hx,9+hy+lift,4,1,'#a9765a');
    if(!sleep){r(11+hx,6+lift,3,1,'#9fe6ff');r(11+hx,5+lift,3,1,'#1b2230');}else r(11+hx,7+hy,3,1,'#5a3a2a');
  }else{
    // torso armour
    r(6,11+lift,9,11,'#232a37');r(7,12+lift,7,6,'#2f3849');r(6,11+lift,1,11,'#46516a');r(8,13+lift,2,2,'#3e4a62');
    r(6,20+lift,9,2,'#0f1117');r(11,20+lift,2,2,'#2a303c');r(4,12+lift,2,7,'#1a1f29');
    // head
    const hy=sleep?2:0,hx=sleep?1:0;
    r(7+hx,2+hy+lift,7,7,'#2b3243');r(8+hx,1+hy+lift,5,1,'#2b3243');r(8+hx,2+hy+lift,4,1,'#56627f');r(7+hx,8+hy+lift,7,1,'#1d2230');
    if(!sleep){r(10,5+lift,5,2,'#79d8ff');r(14,5+lift,1,1,'#e2f8ff');}else r(10+hx,5+hy,5,2,'#1a2030');
    r(10+hx,9+hy+lift,3,2,'#b98566');
    // rifle
    if(sleep){r(6,22,12,2,'#0d0f14');r(7,22,10,1,'#3a4252');r(13,21,3,2,'#14161c');}
    else{r(4,16+lift,4,2,'#0d0f14');r(7,15+lift,13,2,'#0d0f14');r(8,15+lift,11,1,'#3e4757');r(12,17+lift,2,3,'#0d0f14');
      r(19,14+lift,3,3,'#2a2f3a');r(21,15+lift,1,1,'#fff1a0');
      r(7,12+lift,3,4,'#262d3b');r(9,16+lift,2,2,'#14161c');r(12,13+lift,3,2,'#2a3242');r(15,15+lift,2,2,'#14161c');}
  }
  return outline(c,'#040508');
}
const GUARD={};
for(const t of ['sol','sci']){GUARD[t]={walk:[0,1,2,3].map(f=>{const r=makeGuard(f,false,t);return {r,l:flip(r)};}),sleep:(()=>{const r=makeGuard(0,true,t);return {r,l:flip(r)};})()};}

/* ================= LEVELS ================= */
function build(w,h,fn){
  const g=[];for(let y=0;y<h;y++)g.push(new Array(w).fill('#'));
  const b={fill(x0,y0,x1,y1,c){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)g[y][x]=c;},set(x,y,c){g[y][x]=c;}};
  fn(b);return g;
}
const LEVELS=[
{ name:'CONTENÇÃO', card:'Laboratório de Contenção', theme:'lab', w:72,h:22, start:[5,19],
  grid:b=>{
    b.fill(2,6,69,19,'.');
    b.fill(14,6,15,16,'#');
    b.fill(4,6,6,19,'U');
    b.fill(22,17,23,19,'B');b.set(27,19,'B');b.set(22,16,'w');b.set(26,19,'w');
    b.set(30,19,'F');
    b.fill(32,18,32,19,'B');
    b.fill(34,14,36,19,'S');
    b.set(41,19,'P');
    b.fill(50,16,53,16,'-');
    b.fill(54,13,57,13,'-');
    b.fill(58,13,69,13,'#');
    b.fill(62,14,69,19,'#');
    b.set(60,12,'a');b.fill(64,6,64,12,'1');b.fill(67,11,67,12,'X');

/* ================= PHYSICS ================= */
function hit(e){
  const x0=Math.floor(e.x/T),x1=Math.floor((e.x+e.w-0.001)/T),y0=Math.floor(e.y/T),y1=Math.floor((e.y+e.h-0.001)/T);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(solid(x,y))return true;return false;
}
function oneWayBlock(e,prevBottom){
  const bottom=e.y+e.h,ty=Math.floor((bottom-0.001)/T),top=ty*T;
  if(!(prevBottom<=top+0.001&&bottom>top))return false;
  const x0=Math.floor(e.x/T),x1=Math.floor((e.x+e.w-0.001)/T);
  for(let x=x0;x<=x1;x++)if(tile(x,ty)==='-')return true;return false;
}
function moveX(e,dx){const s=Math.sign(dx);let r=Math.abs(dx);while(r>0){const st=Math.min(1,r);e.x+=s*st;if(hit(e)){e.x-=s*st;e.vx=0;return true;}r-=st;}return false;}
function moveY(e,dy){const s=Math.sign(dy);let r=Math.abs(dy);while(r>0){const st=Math.min(1,r);const pb=e.y+e.h;e.y+=s*st;
  if(hit(e)||(s>0&&oneWayBlock(e,pb))){e.y-=s*st;if(s>0)e.onGround=true;e.vy=0;return true;}r-=st;}return false;}
function los(x0,y0,x1,y1){const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/2);for(let i=1;i<n;i++){const t=i/n;if(opaque(Math.floor((x0+(x1-x0)*t)/T),Math.floor((y0+(y1-y0)*t)/T)))return false;}return true;}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function laserOn(tx){return (tick+tx*53)%200<105;}
function laserWarn(tx){return (tick+tx*53)%200>=180;}

/* ================= VIEWERS ================= */
function guardView(g){return {ox:g.dir>0?g.x+g.w-1:g.x+1,oy:g.y+4,ang:g.dir>0?0:Math.PI,half:0.42,range:84};}
function camView(c){return {ox:c.x,oy:c.y+3,ang:Math.PI/2+Math.sin(tick*0.014+c.ph)*0.85,half:0.2,range:c.range};}
function sees(v){
  const pts=[[P.x+P.w/2,P.y+2],[P.x+P.w/2,P.y+P.h-2]];
  for(const [tx,ty] of pts){
    const dx=tx-v.ox,dy=ty-v.oy,d=Math.hypot(dx,dy);if(d>v.range)continue;
    let da=Math.atan2(dy,dx)-v.ang;da=Math.atan2(Math.sin(da),Math.cos(da));
    if(Math.abs(da)>v.half)continue;
    if(los(v.ox,v.oy,tx,ty))return d;
  }
  return -1;
}
function castRay(ox,oy,a,range){const c=Math.cos(a),s=Math.sin(a);let d=0;while(d<range){d+=2;if(opaque(Math.floor((ox+c*d)/T),Math.floor((oy+s*d)/T)))break;}return Math.min(d,range);}

/* ================= GAMEPLAY ================= */
function caught(msg){if(mode!=='play')return;mode='caught';caughtT=95;caughtMsg=msg;shake=12;sfx('caught');}
function float(x,y,txt,col){floats.push({x,y,txt,col:col||'#e4f1e6',t:60});}
function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=Math.random()*(sp||1.2);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-0.3,life:30+Math.random()*25,col,g:0.02});}}
function ring(x,y,col){rings.push({x,y,t:0,col:col||'95,242,208'});}
function findAnchor(ex){
  let best=null,bs=1e9;const cx=P.x+P.w/2,cy=P.y+P.h/2;
  for(const a of lv.anchors){
    if(a===ex)continue;const ax=a.x*T+4,ay=a.y*T+4;
    if(ay>cy-4)continue;const d=Math.hypot(ax-cx,ay-cy);if(d>100)continue;
    if(!los(cx,cy,ax,ay))continue;
    const s=d-((ax-cx)*P.face>0?40:0);if(s<bs){bs=s;best=a;}
  }
  return best;
}
function standUp(){if(P.crouch){P.crouch=false;P.y-=4;P.h=10;}}
function tryVine(){
  const a=findAnchor(P.anchor);
  if(!a){float(P.x-10,P.y-8,'SEM GANCHO','#9aa6bd');sfx('nope');return;}
  if(energy<12){float(P.x-12,P.y-8,'SEM ENERGIA','#ffcf5a');sfx('nope');return;}
  energy-=12;standUp();P.state='zip';P.anchor=a;P.vx=P.vy=0;sfx('vine');ring(P.x+3,P.y+5);
}
function updatePlayer(){
  const p=P;
  if(p.state==='zip'||p.state==='hang'){
    const a=p.anchor,tx=a.x*T+4-p.w/2,ty=(a.y+1)*T;
    if(p.state==='zip'){
      const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);
      if(d<=5){p.x=tx;p.y=ty;p.state='hang';burst(a.x*T+4,a.y*T+6,'#5ff2d0',6,0.8);}
      else{p.x+=dx/d*5;p.y+=dy/d*5;}
      return;
    }
    if(held.left)p.face=-1;if(held.right)p.face=1;
    if(pressed('jump')){p.state='normal';p.vy=-4.1;p.vx=(held.right?1.35:0)-(held.left?1.35:0);p.anchor=null;sfx('jump');}
    else if(pressed('down')){p.state='normal';p.vy=0.5;p.anchor=null;}
    else if(pressed('vine'))tryVine();
    return;
  }
  const wantCrouch=held.down&&p.onGround;
  if(wantCrouch&&!p.crouch){p.crouch=true;p.y+=4;p.h=6;}
  else if(!wantCrouch&&p.crouch){if(!hit({x:p.x,y:p.y-4,w:p.w,h:10}))standUp();}
  const ax=(held.right?1:0)-(held.left?1:0);
  if(ax)p.face=ax;
  const spd=p.crouch?0.55:1.35;
  p.vx+=(ax*spd-p.vx)*(p.onGround?0.35:0.2);
  if(Math.abs(p.vx)<0.02)p.vx=0;
  if(pressed('jump'))p.jumpBuf=7;else if(p.jumpBuf>0)p.jumpBuf--;
  if(p.onGround)p.coyote=6;else if(p.coyote>0)p.coyote--;
  if(p.jumpBuf>0&&p.coyote>0&&!p.crouch){p.vy=-4.1;p.jumpBuf=0;p.coyote=0;p.onGround=false;sfx('jump');burst(p.x+3,p.y+p.h,'#5b6a86',4,0.6);}
  if(!held.jump&&p.vy<-1.6)p.vy+=0.3;

function tileInteractions(){

  }

function updateGuards(){
  for(const g of guards){
    if(g.sleep>0){g.sleep--;if(tick%40===0)floats.push({x:g.x+6,y:g.y-4,txt:'z',col:'#b9c6e0',t:40,vy:-0.3});if(g.sleep===0)float(g.x-4,g.y-10,'?!','#ffe27a');continue;}
    const v=guardView(g);
    const d=P.hidden?-1:sees(v);
    if(d>=0)g.sus=Math.min(1,g.sus+0.018+0.05*(1-d/v.range));
    else g.sus=Math.max(0,g.sus-0.006);
    if(g.sus>=1){caught(g.type==='sci'?'O técnico deu o alarme!':'Um guarda viu você!');return;}
    if(g.sus>0.25){g.dir=Math.sign(P.x-g.x)||g.dir;}
    else if(g.pause>0){g.pause--;if(g.pause===0)g.dir*=-1;}
    else{
      const nx=g.x+g.dir*0.45,front=g.dir>0?nx+g.w:nx,tx=Math.floor(front/T),tm=Math.floor((g.y+8)/T),tf=Math.floor((g.y+g.h-1)/T);

}
function updateSpores(){
  for(let i=spores.length-1;i>=0;i--){
    const s=spores[i];s.t++;s.vy+=0.14;s.x+=s.vx;s.y+=s.vy;
    if(tick%2===0)parts.push({x:s.x,y:s.y,vx:0,vy:0,life:14,col:'#d79be6',g:0});
    let pop=s.t>110||solid(Math.floor(s.x/T),Math.floor(s.y/T));

function levelDone(){

/* ================= UPDATE ================= */
function update(){
  tick++;sceneT++;
  if(pressed('mute')){muted=!muted;setDrone(mode==='play');}
  if(!overlay.hidden)updateOverlay();
  else if(mode==='menu'){if(confirmPressed()){sfx('check');startGame();}}
  else if(mode==='paused'){if(pressed('pause')||confirmPressed())mode='play';}
  else if(mode==='play'){
    if(pressed('pause'))mode='paused';
    else{
      updatePlayer();
      if(mode==='play')tileInteractions();
      if(mode==='play')updateGuards();
      updateSpores();
      if(P.y>lv.h*T)caught('Você caiu!');
    }
  }else if(mode==='caught'){caughtT--;if(caughtT<=0){respawn(false);mode='play';}}
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.life--;if(q.life<=0)parts.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t--;f.y+=f.vy||-0.25;if(f.t<=0)floats.splice(i,1);}
  for(let i=rings.length-1;i>=0;i--){rings[i].t++;if(rings[i].t>36)rings.splice(i,1);}
  if(lv&&P&&scene==='play'){
    const tx=clampCamX(P.x+3-W/2+P.face*24),ty=clampCamY(P.y-H/2+10);
    camX+=(tx-camX)*0.1;camY+=(ty-camY)*0.1;
  }
  if(shake>0)shake--;
  let a=0;for(const g of guards)if(g.sleep===0)a=Math.max(a,g.sus);for(const c of cams)a=Math.max(a,c.sus);
  alertLevel=mode==='play'?a:0;
  if(alertLevel>0.15&&tick-lastSusBeep>Math.max(6,30-alertLevel*26)){lastSusBeep=tick;sfx('sus');}
  for(const k in held)prev[k]=held[k];
  for(const k in latch)latch[k]=false;
  tapped=false;
}

  // holo rings
  for(const r of rings){const k=r.t/36;ctx.strokeStyle='rgba('+r.col+','+(0.8*(1-k)).toFixed(2)+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(sx(r.x),sy(r.y),8+k*44,0,Math.PI*2);ctx.stroke();ctx.lineWidth=1;ctx.beginPath();ctx.arc(sx(r.x),sy(r.y),4+k*26,0,Math.PI*2);ctx.stroke();}
  // particles
  for(const q of parts){ctx.globalAlpha=Math.min(1,q.life/20);R(sx(q.x),sy(q.y),2,2,q.col);}
  ctx.globalAlpha=1;
  for(const f of floats){ctx.globalAlpha=Math.min(1,f.t/20);txt(f.txt,sx(f.x),sy(f.y),f.col);}
  ctx.globalAlpha=1;
  if(alertLevel>0.05){const a=(alertLevel*0.45*(0.6+0.4*Math.sin(tick*0.4))).toFixed(3);R(0,0,SW,3,'rgba(255,61,138,'+a+')');R(0,SH-3,SW,3,'rgba(255,61,138,'+a+')');R(0,0,3,SH,'rgba(255,61,138,'+a+')');R(SW-3,0,3,SH,'rgba(255,61,138,'+a+')');}
  renderHUD();
}
function renderHUD(){
  // chlorophyll gauge
  R(8,8,150,22,'rgba(5,9,14,0.78)');R(8,8,150,1,'rgba(95,242,208,0.35)');
  txt('CLOROFILA',14,12,'#5ff2d0',8,false);
  const segs=10,lit=Math.ceil(energy/10-0.001),low=energy<30;
  for(let i=0;i<segs;i++){R(14+i*13,22,11,4,i<lit?(low&&tick%20<10?'#ffcf5a':'#5ff2d0'):'#16302c');}
  if(P.hidden){R(166,8,90,22,'rgba(5,9,14,0.78)');txt('ESCONDIDA',172,15,'#b98cff',8,false);}
  const lab=(lvIndex+1)+'/'+LEVELS.length+'  '+lv.d.name;R(SW-tw(lab)-22,8,tw(lab)+14,22,'rgba(5,9,14,0.78)');txt(lab,SW-tw(lab)-15,15,'#9fb3c9',8,false);
  // skills strip
  const n=Math.floor(energy/30);
  const parts2=[['HABILIDADES','#5ff2d0'],['CIPÓ','#eafffb'],[' ·  ESPOROS','#eafffb'],[' x'+n,n?'#eafffb':'#ff6a5a']];
  let wsum=0;for(const [s] of parts2)wsum+=tw(s)+8;let x=SW/2-wsum/2;
  R(x-10,SH-26,wsum+20,18,'rgba(5,9,14,0.72)');
  for(const [s,c] of parts2){txt(s,x,SH-21,c,8);x+=tw(s)+8;}
  // hint
  if(mode==='play'||mode==='paused'){
    const col=Math.floor((P.x+3)/T);const h=lv.d.hints.find(([a,b])=>col>=a&&col<=b);
    if(h){const s=h[2].replace(/\[(\w)\]/g,(_,k)=>keyLabel(k));const font='22px '+TERM;const lines=wrapText(s,SW-60,font);const bh=lines.length*20+10;
      R(8,36,SW-16,bh,'rgba(5,9,14,0.8)');R(8,36,3,bh,'#5ff2d0');
      ctx.font=font;ctx.textBaseline='top';lines.forEach((l,i)=>{ctx.fillStyle='#d8eee6';ctx.fillText(l,22,40+i*20);});}
  }
  if(mode==='paused'){R(0,0,SW,SH,'rgba(0,0,0,0.6)');const a='PAUSADO',b=touchMode?'toque para voltar':'P ou ENTER volta';txt(a,SW/2-tw(a,16)/2,SH/2-24,'#e4f1e6',16);txt(b,SW/2-tw(b)/2,SH/2+4,'#9fb3c9');}
  if(mode==='caught'){
    const k=Math.min(1,(95-caughtT)/12);R(0,0,SW,SH,'rgba(120,10,40,'+(0.4*k).toFixed(2)+')');
    R(0,SH/2-40,SW,72,'rgba(5,7,12,0.88)');R(0,SH/2-40,SW,2,'#ff3d8a');R(0,SH/2+30,SW,2,'#ff3d8a');
    const t1='CAPTURADA';txt(t1,SW/2-tw(t1,16)/2,SH/2-26,'#ff3d8a',16);txt(caughtMsg,SW/2-tw(caughtMsg)/2,SH/2+6,'#e4f1e6');
  }
}
/* ---- sky scenes (title + ending) ---- */
const STARS=[];for(let i=0;i<180;i++)STARS.push({x:Math.random()*SW,y:Math.random()*240,p:Math.random()*6.28,b:Math.random()});
const RIDGE1=[],RIDGE2=[],TREES=[];
for(let x=0;x<=SW;x++){RIDGE1.push(224+Math.sin(x*0.0105)*20+Math.sin(x*0.0285+1)*10);RIDGE2.push(260+Math.sin(x*0.015+2)*14+Math.sin(x*0.045)*6);}
for(let x=-8;x<SW+16;x+=9+((x*7)%7))TREES.push({x,h:16+((x*13)%18)});
function drawSky(t,ending){
  const gr=ctx.createLinearGradient(0,0,0,SH);gr.addColorStop(0,'#03050d');gr.addColorStop(0.6,'#0c1430');gr.addColorStop(1,'#18234a');
  R(0,0,SW,SH,gr);
  for(const s of STARS){const a=0.3+0.7*Math.abs(Math.sin(t*0.02+s.p));R(s.x|0,s.y|0,s.b>0.8?2:1,s.b>0.8?2:1,'rgba(220,230,255,'+(a*(0.4+0.6*s.b)).toFixed(2)+')');}
  if(ending&&t>200){const k=(t-200)%140,on=k<60&&(Math.floor(k/20)%2===0);R(500,52,4,4,on?'#eafff0':'#6a8a8a');
    if(on){R(492,53,20,2,'rgba(180,255,220,0.6)');R(501,44,2,20,'rgba(180,255,220,0.6)');}}
  for(let x=0;x<SW;x++)R(x,RIDGE1[x]|0,1,SH,'#0b1124');
  for(let x=0;x<SW;x++)R(x,RIDGE2[x]|0,1,SH,'#070b18');
  R(0,300,SW,SH-300,'#03060d');
  ctx.fillStyle='#03060d';for(const tr of TREES){for(let i=0;i<tr.h;i++){const w=Math.max(1,Math.floor((tr.h-i)/2));ctx.fillRect(tr.x-w,300-i,w*2+2,1);}}
}
function renderTitle(){
  const t=sceneT;drawSky(t,false);
  const mt=t%260;
  if(mt<70){const x=80+mt*6.4,y=20+mt*3.2;for(let i=0;i<24;i++){R((x-i*4.8)|0,(y-i*2.4)|0,4,2,'rgba(255,'+(170+i*3)+','+(90+i*6)+','+(1-i/24).toFixed(2)+')');}R(x|0,y|0,4,4,'#fff3c0');}
  if(mt>=70&&mt<92){ctx.fillStyle='rgba(255,220,150,'+((92-mt)/22*0.5).toFixed(2)+')';ctx.beginPath();ctx.arc(532,300,(mt-70)*3,0,Math.PI*2);ctx.fill();}
  const T1='MUDA',w1=tw(T1,48);
  txt(T1,SW/2-w1/2+3,70,'#04201a',48,false);txt(T1,SW/2-w1/2,66,'#1d7d68',48,false);txt(T1,SW/2-w1/2,64,'#5ff2d0',48,false);
  R(SW/2-w1/2,64,w1,3,'#c8fff1');
  const t2='FUGA DO SETOR 9';txt(t2,SW/2-tw(t2,16)/2,132,'#b98cff',16);
  ctx.drawImage(MUDA.idle0.r,0,0,26,28,SW/2-26,296-56,52,56);
  ctx.strokeStyle='rgba(95,242,208,'+(0.25+0.2*Math.sin(t*0.05)).toFixed(2)+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(SW/2,268,40+Math.sin(t*0.05)*3,0,Math.PI*2);ctx.stroke();ctx.lineWidth=1;
  if(t%60<40){const t3=touchMode?'TOQUE PARA COMEÇAR':'ENTER PARA COMEÇAR';txt(t3,SW/2-tw(t3)/2,184,'#e4f1e6');}
  const t4='DEMO · 3 NÍVEIS';txt(t4,SW/2-tw(t4)/2,322,'#6f7d96',8,false);
}
function renderEnding(){
  const t=sceneT;drawSky(t,true);
  R(298,292,44,8,'#2b3550');R(302,294,36,2,'#5ff2d0');
  const r=t*1.8;
  for(let i=0;i<TREES.length;i++){const tr=TREES[i],d=Math.abs(tr.x-320);if(d<r){const a=Math.min(1,(r-d)/80)*(0.55+0.25*Math.sin(t*0.05+i));
    R(tr.x,300-tr.h+4,2,2,'rgba(150,240,170,'+(a*0.9).toFixed(2)+')');R(tr.x-3,300-(tr.h>>1),2,2,'rgba(150,240,170,'+(a*0.7).toFixed(2)+')');R(tr.x+3,300-(tr.h>>2),2,2,'rgba(95,242,208,'+(a*0.7).toFixed(2)+')');
    R(tr.x-4,302,10,3,'rgba(95,242,208,'+(a*0.2).toFixed(2)+')');}}
  const sp=(t%70<35)?MUDA.idle0:MUDA.idle1;ctx.drawImage(sp.r,0,0,26,28,294,292-56,52,56);
}
function render(){
  ctx.imageSmoothingEnabled=false;
  if(scene==='title')renderTitle();
  else if(scene==='ending')renderEnding();
  else if(lv&&P)renderPlay();
}

/* ================= LOOP / FIT ================= */
function fit(){
  const vw=document.documentElement.clientWidth-32;
  const extra=(pad.hidden?0:pad.offsetHeight+10)+document.getElementById('legend').offsetHeight+document.getElementById('credit').offsetHeight+44;
  const vh=window.innerHeight-extra;
  let w=Math.max(200,Math.min(vw,vh*SW/SH));const s=Math.floor(w/SW);if(s>=2)w=s*SW;
  wrap.style.width=Math.floor(w)+'px';
}
addEventListener('resize',fit);
let acc=0,last=0;
function frame(now){
  if(!last)last=now;acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){update();acc-=1000/60;}
  render();requestAnimationFrame(frame);
}
function boot(data){
  fit();
  if(data&&typeof data.lvl==='number'&&data.lvl>0&&data.lvl<LEVELS.length){scene='play';energy=100;loadLevel(data.lvl);mode='play';}
  requestAnimationFrame(frame);
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({lvl:scene==='play'?lvIndex:0}));}catch(_){}
function start(){const h=window.claude&&window.claude.hot;if(h&&h.ready)h.ready(boot);else boot(h&&h.data||{});}
let started=false;const go=()=>{if(started)return;started=true;start();};
if(document.fonts&&document.fonts.load){Promise.race([Promise.all([document.fonts.load('8px "Press Start 2P"'),document.fonts.load('22px VT323')]),new Promise(r=>setTimeout(r,2500))]).then(go,go);}else go();
window.__muda={get mode(){return mode},get P(){return P},get lv(){return lv},get guards(){return guards},held,startGame,
  loadLevel:i=>{scene='play';loadLevel(i);mode='play';overlay.hidden=true;},setEnergy:v=>{energy=v},sprites:{MUDA,GUARD}};
})();
</script>
